  Appliance:
    type: "object"
    properties:
      path:
        type: "string"
      disks:
        type: "array"
        items:
          type: "string"
      virtualSystemDescriptions:
        type: "array"
        items:
          $ref: "#/definitions/VirtualSystemDescription"
      machines:
        type: "array"
        items:
          type: "string"
      certificate:
        $ref: "#/definitions/Certificate"
    description: " Represents a platform-independent appliance in OVF format. An instance\
      \ of this is returned by IVirtualBox::createAppliance, which can then be used\
      \ to import and export virtual machines within an appliance with VirtualBox.\n\
      The OVF standard suggests two different physical file formats:\n<ol> <li>If\
      \ the appliance is distributed as a set of files, there must be at least one\
      \ XML descriptor file that conforms to the OVF standard and carries an .ovf\
      \ file extension. If this descriptor file references other files such as disk\
      \ images, as OVF appliances typically do, those additional files must be in\
      \ the same directory as the descriptor file. </li> <li>If the appliance is distributed\
      \ as a single file, it must be in TAR format and have the .ova file extension.\
      \ This TAR file must then contain at least the OVF descriptor files and optionally\
      \ other files.\nAt this time, VirtualBox does not not yet support the packed\
      \ (TAR) variant; support will be added with a later version. </li> </ol> <b>Importing\
      \ </b> an OVF appliance into VirtualBox as instances of IMachine involves the\
      \ following sequence of API calls:\n<ol> <li>Call IVirtualBox::createAppliance.\
      \ This will create an empty IAppliance object. </li> <li>On the new object,\
      \ call #read with the full path of the OVF file you would like to import. So\
      \ long as this file is syntactically valid, this will succeed and fill the appliance\
      \ object with the parsed data from the OVF file. </li> <li>Next, call #interpret,\
      \ which analyzes the OVF data and sets up the contents of the IAppliance attributes\
      \ accordingly. These can be inspected by a VirtualBox front-end such as the\
      \ GUI, and the suggestions can be displayed to the user. In particular, the\
      \ #virtualSystemDescriptions array contains instances of IVirtualSystemDescription\
      \ which represent the virtual systems (machines) in the OVF, which in turn describe\
      \ the virtual hardware prescribed by the OVF (network and hardware adapters,\
      \ virtual disk images, memory size and so on). The GUI can then give the user\
      \ the option to confirm and/or change these suggestions. </li> <li>If desired,\
      \ call IVirtualSystemDescription::setFinalValues for each virtual system (machine)\
      \ to override the suggestions made by the #interpret routine. </li> <li>Finally,\
      \ call #importMachines to create virtual machines in VirtualBox as instances\
      \ of IMachine that match the information in the virtual system descriptions.\
      \ After this call succeeded, the UUIDs of the machines created can be found\
      \ in the #machines array attribute. </li> </ol> <b>Exporting </b> VirtualBox\
      \ machines into an OVF appliance involves the following steps:\n<ol> <li>As\
      \ with importing, first call IVirtualBox::createAppliance to create an empty\
      \ IAppliance object. </li> <li>For each machine you would like to export, call\
      \ IMachine::exportTo with the IAppliance object you just created. Each such\
      \ call creates one instance of IVirtualSystemDescription inside the appliance.\
      \ </li> <li>If desired, call IVirtualSystemDescription::setFinalValues for each\
      \ virtual system (machine) to override the suggestions made by the IMachine::exportTo\
      \ routine. </li> <li>Finally, call #write with a path specification to have\
      \ the OVF file written. </li> </ol> "
    example:
      path: "path"
      disks:
      - "disks"
      - "disks"
      certificate:
        serialNumber: "serialNumber"
        publicKeyAlgorithmOID: "publicKeyAlgorithmOID"
        issuerName:
        - "issuerName"
        - "issuerName"
        validityPeriodNotAfter: "validityPeriodNotAfter"
        publicKeyAlgorithm: "publicKeyAlgorithm"
        issuerUniqueIdentifier: "issuerUniqueIdentifier"
        versionNumber: {}
        validityPeriodNotBefore: "validityPeriodNotBefore"
        keyUsage: 6
        expired: true
        trusted: true
        extendedKeyUsage:
        - "extendedKeyUsage"
        - "extendedKeyUsage"
        subjectUniqueIdentifier: "subjectUniqueIdentifier"
        selfSigned: true
        signatureAlgorithmOID: "signatureAlgorithmOID"
        signatureAlgorithmName: "signatureAlgorithmName"
        rawCertData: "rawCertData"
        certificateAuthority: true
        friendlyName: "friendlyName"
        subjectPublicKey: "subjectPublicKey"
        subjectName:
        - "subjectName"
        - "subjectName"
      virtualSystemDescriptions:
      - count: 0
      - count: 0
      machines:
      - "machines"
      - "machines"
  VirtualSystemDescription:
    type: "object"
    properties:
      count:
        type: "integer"

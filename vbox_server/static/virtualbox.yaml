  /vms/{vmid}/actions/save:
    post:
      tags:
      - "vm"
      summary: "Call interface method IMachine::saveState"
      description: " Saves the current execution state of a running virtual machine\
        \ and stops its execution.\nAfter this operation completes, the machine will\
        \ go to the Saved state. The next time it is powered up this state will be\
        \ restored and the machine will continue its execution from the place where\
        \ it was saved.\nThis operation differs from taking a snapshot to the effect\
        \ that it doesn't create new differencing media. Also, once the machine is\
        \ powered up from the state saved using this method, the saved state is deleted,\
        \ so it will be impossible to return to this state later.\nNote! On success,\
        \ this method implicitly calls #saveSettings to save all current machine settings\
        \ (including runtime changes to the DVD medium, etc.). Together with the impossibility\
        \ to change any VM settings when it is in the Saved state, this guarantees\
        \ adequate hardware configuration of the machine when it is restored from\
        \ the saved state file. Note! The machine must be in the Running or Paused\
        \ state, otherwise the operation will fail.\n<h3>Possible results</h3> VBOX_E_INVALID_VM_STATE:\
        \ Virtual machine state neither Running nor Paused.\nVBOX_E_FILE_ERROR: Failed\
        \ to create directory for saved state file. "
      operationId: "machine_savestate"
      produces:
      - "application/json"
      parameters:
      - name: "vmid"
        in: "path"
        description: "The Id of vm"
        required: true
        type: "string"
      responses:

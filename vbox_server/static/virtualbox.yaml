    description: " The IMachine interface represents a virtual machine, or guest,\
      \ created in VirtualBox.\nThis interface is used in two contexts. First of all,\
      \ a collection of objects implementing this interface is stored in the IVirtualBox::machines\
      \ attribute which lists all the virtual machines that are currently registered\
      \ with this VirtualBox installation. Also, once a session has been opened for\
      \ the given virtual machine (e.g. the virtual machine is running), the machine\
      \ object associated with the open session can be queried from the session object;\
      \ see ISession for details.\nThe main role of this interface is to expose the\
      \ settings of the virtual machine and provide methods to change various aspects\
      \ of the virtual machine's configuration. For machine objects stored in the\
      \ IVirtualBox::machines collection, all attributes are read-only unless explicitly\
      \ stated otherwise in individual attribute and method descriptions.\nIn order\
      \ to change a machine setting, a session for this machine must be opened using\
      \ one of the IMachine::lockMachine or IMachine::launchVMProcess methods. After\
      \ the machine has been successfully locked for a session, a mutable machine\
      \ object needs to be queried from the session object and then the desired settings\
      \ changes can be applied to the returned object using IMachine attributes and\
      \ methods. See the ISession interface description for more information about\
      \ sessions.\nNote that IMachine does not provide methods to control virtual\
      \ machine execution (such as start the machine, or power it down) -- these methods\
      \ are grouped in a separate interface called IConsole.\n"

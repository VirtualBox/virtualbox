      sharedFolders:
        type: "array"
        items:
          $ref: "#/definitions/SharedFolder"
    description: " The IVirtualBox interface represents the main interface exposed\
      \ by the product that provides virtual machine management.\nAn instance of IVirtualBox\
      \ is required for the product to do anything useful. Even though the interface\
      \ does not expose this, internally, IVirtualBox is implemented as a singleton\
      \ and actually lives in the process of the VirtualBox server (VBoxSVC.exe).\
      \ This makes sure that IVirtualBox can track the state of all virtual machines\
      \ on a particular host, regardless of which frontend started them.\nTo enumerate\
      \ all the virtual machines on the host, use the IVirtualBox::machines attribute.\n\
      Error information handling is a bit special with IVirtualBox: creating an instance\
      \ will always succeed. The return of the actual error code/information is postponed\
      \ to any attribute or method call. The reason for this is that COM likes to\
      \ mutilate the error code and lose the detailed error information returned by\
      \ instance creation. "


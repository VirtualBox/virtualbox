    description: " The IToken interface represents a token passed to an API client,\
      \ which triggers cleanup actions when it is explicitly released by calling the\
      \ #abandon method (preferred, as it is accurately defined when the release happens),\
      \ or when the object reference count drops to 0. The latter way is implicitly\
      \ used when an API client crashes, however the discovery that there was a crash\
      \ can take rather long, depending on the platform (COM needs 6 minutes). So\
      \ better don't rely on the crash behavior too much. "

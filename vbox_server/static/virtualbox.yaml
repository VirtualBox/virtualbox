  /vms/{vmid}/actions/launch:
    post:
      tags:
      - "vm"
      summary: "Call interface method IMachine::launchVMProcess"
      description: " Spawns a new process that will execute the virtual machine and\
        \ obtains a shared lock on the machine for the calling session.\nIf launching\
        \ the VM succeeds, the new VM process will create its own session and write-lock\
        \ the machine for it, preventing conflicting changes from other processes.\
        \ If the machine is already locked (because it is already running or because\
        \ another session has a write lock), launching the VM process will therefore\
        \ fail. Reversely, future attempts to obtain a write lock will also fail while\
        \ the machine is running.\nThe caller's session object remains separate from\
        \ the session opened by the new VM process. It receives its own IConsole object\
        \ which can be used to control machine execution, but it cannot be used to\
        \ change all VM settings which would be available after a #lockMachine call.\n\
        The caller must eventually release the session's shared lock by calling ISession::unlockMachine\
        \ on the local session object once this call has returned. However, the session's\
        \ state (see ISession::state) will not return to 'Unlocked' until the remote\
        \ session has also unlocked the machine (i.e. the machine has stopped running).\n\
        Launching a VM process can take some time (a new VM is started in a new process,\
        \ for which memory and other resources need to be set up). Because of this,\
        \ an IProgress object is returned to allow the caller to wait for this asynchronous\
        \ operation to be completed. Until then, the caller's session object remains\
        \ in the 'Unlocked' state, and its ISession::machine and ISession::console\
        \ attributes cannot be accessed. It is recommended to use IProgress::waitForCompletion\
        \ or similar calls to wait for completion. Completion is signalled when the\
        \ VM is powered on. If launching the VM fails, error messages can be queried\
        \ via the progress object, if available.\nThe progress object will have at\
        \ least 2 sub-operations. The first operation covers the period up to the\
        \ new VM process calls powerUp. The subsequent operations mirror the IConsole::powerUp\
        \ progress object. Because IConsole::powerUp may require some extra sub-operations,\
        \ the IProgress::operationCount may change at the completion of operation.\n\
        For details on the teleportation progress operation, see IConsole::powerUp.\n\
        The @a environmentChanges argument is a list of strings where every string\
        \ contains environment variable in the putenv style, i.e. 'VAR=VALUE' for\
        \ setting/replacing and 'VAR' for unsetting. These environment variables will\
        \ be applied to the environment of the VirtualBox server process. If an environment\
        \ variable exists both in the server process and in this list, the value from\
        \ this list takes precedence over the server's variable. If the value of the\
        \ environment variable is omitted, this variable will be removed from the\
        \ resulting environment. If the list is empty, the server environment is inherited\
        \ by the started process as is.\n\n<h3>Possible results</h3> E_UNEXPECTED:\
        \ Virtual machine not registered.\nE_INVALIDARG: Invalid session type @a type.\n\
        VBOX_E_OBJECT_NOT_FOUND: No machine matching @a machineId found.\nVBOX_E_INVALID_OBJECT_STATE:\
        \ Session already open or being opened.\nVBOX_E_IPRT_ERROR: Launching process\
        \ for machine failed.\nVBOX_E_VM_ERROR: Failed to assign machine to session. "
      operationId: "machine_launchvmprocess"
      produces:
      - "application/json"
      parameters:
      - name: "vmid"
        in: "path"
        description: "The Id of vm"
        required: true
        type: "string"
      - in: "body"
        name: "oMachineLaunchVMProcessRequestBody"

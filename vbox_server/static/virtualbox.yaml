  VirtualBoxErrorInfo:
    type: "object"
    properties:
      resultCode:
        type: "integer"
        format: "int32"
      resultDetail:
        type: "integer"
        format: "int32"
      interfaceID:
        type: "string"
      component:
        type: "string"
      text:
        type: "string"
      next:
        $ref: "#/definitions/VirtualBoxErrorInfo"
    description: " The IVirtualBoxErrorInfo interface represents extended error information.\n\
      Extended error information can be set by VirtualBox components after unsuccessful\
      \ or partially successful method invocation. This information can be retrieved\
      \ by the calling party as an IVirtualBoxErrorInfo object and then shown to the\
      \ client in addition to the plain 32-bit result code.\nIn MS COM, this interface\
      \ extends the IErrorInfo interface, in XPCOM, it extends the nsIException interface.\
      \ In both cases, it provides a set of common attributes to retrieve error information.\n\
      Sometimes invocation of some component's method may involve methods of other\
      \ components that may also fail (independently of this method's failure), or\
      \ a series of non-fatal errors may precede a fatal error that causes method\
      \ failure. In cases like that, it may be desirable to preserve information about\
      \ all errors happened during method invocation and deliver it to the caller.\
      \ The #next attribute is intended specifically for this purpose and allows to\
      \ represent a chain of errors through a single IVirtualBoxErrorInfo object set\
      \ after method invocation.\nNote! errors are stored to a chain in the reverse\
      \ order, i.e. the initial error object you query right after method invocation\
      \ is the last error set by the callee, the object it points to in the @a next\
      \ attribute is the previous error and so on, up to the first error (which is\
      \ the last in the chain)."
    example:
      component: "component"
      resultDetail: 5
      resultCode: 5
      interfaceID: "interfaceID"
      text: "text"

  VirtualBox:
    type: "object"
    properties:
      version:
        type: "string"
      versionNormalized:
        type: "string"
      revision:
        type: "integer"
        format: "int32"
      packageType:

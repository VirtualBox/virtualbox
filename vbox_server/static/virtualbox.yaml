  /vms/{vmid}/actions/unregister:
    post:
      tags:
      - "vm"
      summary: "Call interface method IMachine::unregister"
      description: " Unregisters a machine previously registered with IVirtualBox::registerMachine\
        \ and optionally do additional cleanup before the machine is unregistered.\n\
        This method does not delete any files. It only changes the machine configuration\
        \ and the list of registered machines in the VirtualBox object. To delete\
        \ the files which belonged to the machine, including the XML file of the machine\
        \ itself, call #deleteConfig, optionally with the array of IMedium objects\
        \ which was returned from this method.\nHow thoroughly this method cleans\
        \ up the machine configuration before unregistering the machine depends on\
        \ the @a cleanupMode argument.\n<ul> <li>With 'UnregisterOnly', the machine\
        \ will only be unregistered, but no additional cleanup will be performed.\
        \ The call will fail if the machine has any snapshots or any media attached\
        \ (see IMediumAttachment).  It is the responsibility of the caller to delete\
        \ all such configuration in this mode.  In this mode, the API behaves like\
        \ the former @c IVirtualBox::unregisterMachine() API which it replaces. </li>\
        \ <li>With 'DetachAllReturnNone', the call will succeed even if the machine\
        \ is in 'Saved' state or if it has snapshots or media attached. All media\
        \ attached to the current machine state or in snapshots will be detached.\
        \ No medium objects will be returned; all of the machine's media will remain\
        \ open. </li> <li>With 'DetachAllReturnHardDisksOnly', the call will behave\
        \ like with 'DetachAllReturnNone', except that all the hard disk medium objects\
        \ which were detached from the machine will be returned as an array. This\
        \ allows for quickly passing them to the #deleteConfig API for closing and\
        \ deletion. </li> <li>With 'Full', the call will behave like with 'DetachAllReturnHardDisksOnly',\
        \ except that all media will be returned in the array, including removable\
        \ media like DVDs and floppies. This might be useful if the user wants to\
        \ inspect in detail which media were attached to the machine. Be careful when\
        \ passing the media array to #deleteConfig in that case because users will\
        \ typically want to preserve ISO and RAW image files. </li> </ul>\n\nA typical\
        \ implementation will use 'DetachAllReturnHardDisksOnly' and then pass the\
        \ resulting IMedium array to #deleteConfig. This way, the machine is completely\
        \ deleted with all its saved states and hard disk images, but images for removable\
        \ drives (such as ISO and RAW files) will remain on disk.\nThis API does not\
        \ verify whether the media files returned in the array are still attached\
        \ to other machines (i.e. shared between several machines). If such a shared\
        \ image is passed to #deleteConfig however, closing the image will fail there\
        \ and the image will be silently skipped.\nThis API may, however, move media\
        \ from this machine's media registry to other media registries (see IMedium\
        \ for details on media registries). For machines created with VirtualBox 4.0\
        \ or later, if media from this machine's media registry are also attached\
        \ to another machine (shared attachments), each such medium will be moved\
        \ to another machine's registry. This is because without this machine's media\
        \ registry, the other machine cannot find its media any more and would become\
        \ inaccessible.\nThis API implicitly calls #saveSettings to save all current\
        \ machine settings before unregistering it. It may also silently call #saveSettings\
        \ on other machines if media are moved to other machines' media registries.\n\
        After successful method invocation, the IMachineRegisteredEvent event is fired.\n\
        The call will fail if the machine is currently locked (see ISession).\nNote!\
        \ If the given machine is inaccessible (see #accessible), it will be unregistered\
        \ and fully uninitialized right afterwards. As a result, the returned machine\
        \ object will be unusable and an attempt to call <b>any </b> method will return\
        \ the 'Object not ready' error.\n<h3>Possible results</h3> VBOX_E_INVALID_OBJECT_STATE:\
        \ Machine is currently locked for a session. "
      operationId: "machine_unregister"
      produces:
      - "application/json"
      parameters:
      - name: "vmid"
        in: "path"
        description: "The Id of vm"
        required: true
        type: "string"
      - name: "cleanupMode"
        in: "query"
        description: "For the possible values of enumeration look into #/definitions/CleanupMode"
        required: false
        type: "string"
      responses:
        "200":
          description: "Successful operation"
          schema:
            $ref: "#/definitions/Medium_array_response"
        "400":

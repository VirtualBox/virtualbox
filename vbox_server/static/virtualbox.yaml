  USBConnectionSpeed:
    type: "string"
    description: " USB device/port speed state. This enumeration represents speeds\
      \ at which a USB device can communicate with the host.\nThe speed is a function\
      \ of both the device itself and the port which it is attached to, including\
      \ hubs and cables in the path.\nNote! Due to differences in USB stack implementations\
      \ on various hosts, the reported speed may not exactly match the actual speed. "
    enum:

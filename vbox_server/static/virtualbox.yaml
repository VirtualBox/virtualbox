    delete:
      tags:
      - "vm"
      summary: "Call interface method IMachine::deleteConfig"
      description: " Deletes the files associated with this machine from disk. If\
        \ medium objects are passed in with the @a aMedia argument, they are closed\
        \ and, if closing was successful, their storage files are deleted as well.\
        \ For convenience, this array of media files can be the same as the one returned\
        \ from a previous #unregister call.\nThis method must only be called on machines\
        \ which are either write-locked (i.e. on instances returned by ISession::machine)\
        \ or on unregistered machines (i.e. not yet registered machines created by\
        \ IVirtualBox::createMachine or opened by IVirtualBox::openMachine, or after\
        \ having called #unregister).\nThe following files will be deleted by this\
        \ method: <ul> <li>If #unregister had been previously called with a @a cleanupMode\
        \ argument other than 'UnregisterOnly', this will delete all saved state files\
        \ that the machine had in use; possibly one if the machine was in either the\
        \ 'Saved' or 'AbortedSaved' state and one for each online snapshot that the\
        \ machine had. </li> <li>On each medium object passed in the @a aMedia array,\
        \ this will call IMedium::close. If that succeeds, this will attempt to delete\
        \ the medium's storage on disk. Since the IMedium::close call will fail if\
        \ the medium is still in use, e.g. because it is still attached to a second\
        \ machine; in that case the storage will not be deleted. </li> <li>Finally,\
        \ the machine's own XML file will be deleted. </li> </ul>\n\nSince deleting\
        \ large disk image files can be a time-consuming I/O operation, this method\
        \ operates asynchronously and returns an IProgress object to allow the caller\
        \ to monitor the progress. There will be one sub-operation for each file that\
        \ is being deleted (saved state or medium storage file).\nNote! #settingsModified\
        \ will return @c true after this method successfully returns.\n<h3>Possible\
        \ results</h3> VBOX_E_INVALID_VM_STATE: Machine is registered but not write-locked.\n\
        VBOX_E_IPRT_ERROR: Could not delete the settings file. "
      operationId: "machine_deleteconfig"
      produces:
      - "application/json"
      parameters:
      - name: "vmid"
        in: "path"
        description: "The Id of vm"
        required: true
        type: "string"
      - name: "media"
        in: "query"
        description: "Put here an ID of requested IMedium VirtualBox object"
        required: false
        type: "array"
        items:

    type: "object"
    properties:
      id:
        type: "string"
      description:
        type: "string"
      cancelable:
        type: "boolean"
      percent:
        type: "integer"
        format: "int32"
      timeRemaining:
        type: "integer"
        format: "int32"
      completed:
        type: "boolean"
      canceled:
        type: "boolean"
      resultCode:
        type: "integer"
        format: "int32"
      errorInfo:
        $ref: "#/definitions/VirtualBoxErrorInfo"
      operationCount:
        type: "integer"
        format: "int32"
      operation:
        type: "integer"
        format: "int32"
      operationDescription:
        type: "string"
      operationPercent:
        type: "integer"
        format: "int32"
      operationWeight:
        type: "integer"
        format: "int32"
      timeout:
        type: "integer"
        format: "int32"
    description: " The IProgress interface is used to track and control asynchronous\
      \ tasks within VirtualBox.\nAn instance of this is returned every time VirtualBox\
      \ starts an asynchronous task (in other words, a separate thread) which continues\
      \ to run after a method call returns. For example, IMachine::saveState, which\
      \ saves the state of a running virtual machine, can take a long time to complete.\
      \ To be able to display a progress bar, a user interface such as the VirtualBox\
      \ graphical user interface can use the IProgress object returned by that method.\n\
      Note that IProgress is a 'read-only' interface in the sense that only the VirtualBox\
      \ internals behind the Main API can create and manipulate progress objects,\
      \ whereas client code can only use the IProgress object to monitor a task's\
      \ progress and, if #cancelable is @c true, cancel the task by calling #cancel.\n\
      A task represented by IProgress consists of either one or several sub-operations\
      \ that run sequentially, one by one (see #operation and #operationCount). Every\
      \ operation is identified by a number (starting from 0) and has a separate description.\n\
      You can find the individual percentage of completion of the current operation\
      \ in #operationPercent and the percentage of completion of the task as a whole\
      \ in #percent.\nSimilarly, you can wait for the completion of a particular operation\
      \ via #waitForOperationCompletion or for the completion of the whole task via\
      \ #waitForCompletion. "
    example:
      operationWeight: 3
      operationCount: 2
      cancelable: true
      operationDescription: "operationDescription"
      resultCode: 1
      description: "description"
      timeRemaining: 6
      errorInfo:
        component: "component"
        resultDetail: 5
        resultCode: 5
        interfaceID: "interfaceID"
        text: "text"
      completed: true
      operationPercent: 9
      percent: 0
      timeout: 2
      canceled: true
      id: "id"
      operation: 7
  Snapshot:
    type: "object"
    properties:
      id:
        type: "string"
      name:
        type: "string"
      description:
        type: "string"
      timeStamp:
        type: "integer"
        format: "int64"
      online:
        type: "boolean"
      machine:
        type: "string"
      parent:
        type: "string"
      children:
        type: "array"
        items:
          type: "string"
      childrenCount:
        type: "integer"
        format: "int32"
    description: " The ISnapshot interface represents a snapshot of the virtual machine.\n\
      Together with the differencing media that are created when a snapshot is taken,\
      \ a machine can be brought back to the exact state it was in when the snapshot\
      \ was taken.\nThe ISnapshot interface has no methods, only attributes; snapshots\
      \ are controlled through methods of the IMachine interface which also manage\
      \ the media associated with the snapshot. The following operations exist:\n\
      <ul> <li>IMachine::takeSnapshot creates a new snapshot by creating new, empty\
      \ differencing images for the machine's media and saving the VM settings and\
      \ (if the VM is running) the current VM state in the snapshot.\nThe differencing\
      \ images will then receive all data written to the machine's media, while their\
      \ parent (base) images remain unmodified after the snapshot has been taken (see\
      \ IMedium for details about differencing images). This simplifies restoring\
      \ a machine to the state of a snapshot: only the differencing images need to\
      \ be deleted.\nThe current machine state is not changed by taking a snapshot\
      \ except that IMachine::currentSnapshot is set to the newly created snapshot,\
      \ which is also added to the machine's snapshots tree. </li> <li>IMachine::restoreSnapshot\
      \ resets a machine to the state of a previous snapshot by deleting the differencing\
      \ image of each of the machine's media and setting the machine's settings and\
      \ state to the state that was saved in the snapshot (if any).\nThis destroys\
      \ the machine's current state. After calling this, IMachine::currentSnapshot\
      \ points to the snapshot that was restored. </li> <li>IMachine::deleteSnapshot\
      \ deletes a snapshot without affecting the current machine state.\nThis does\
      \ not change the current machine state, but instead frees the resources allocated\
      \ when the snapshot was taken: the settings and machine state file are deleted\
      \ (if any), and the snapshot's differencing image for each of the machine's\
      \ media gets merged with its parent image.\nNeither the current machine state\
      \ nor other snapshots are affected by this operation, except that parent media\
      \ will be modified to contain the disk data associated with the snapshot being\
      \ deleted.\nWhen deleting the current snapshot, the IMachine::currentSnapshot\
      \ attribute is set to the current snapshot's parent or @c null if it has no\
      \ parent. Otherwise the attribute is unchanged. </li> </ul>\n\nEach snapshot\
      \ contains a copy of virtual machine's settings (hardware configuration etc.).\
      \ This copy is contained in an immutable (read-only) instance of IMachine which\
      \ is available from the snapshot's #machine attribute. When restoring the snapshot,\
      \ these settings are copied back to the original machine.\nIn addition, if the\
      \ machine was running when the snapshot was taken (IMachine::state is MachineState_Running),\
      \ the current VM state is saved in the snapshot (similarly to what happens when\
      \ a VM's state is saved). The snapshot is then said to be  <i>online </i> because\
      \ when restoring it, the VM will be running.\nIf the machine was in the MachineState_Saved\
      \ or MachineState_AbortedSaved state, the snapshot receives a copy of the execution\
      \ state file (IMachine::stateFilePath).\nOtherwise, if the machine was not running\
      \ (MachineState_PoweredOff or MachineState_Aborted), the snapshot is  <i>offline\
      \ </i>; it then contains a so-called 'zero execution state', representing a\
      \ machine that is powered off. "
    example:
      timeStamp: 2
      parent: "parent"
      children:
      - "children"
      - "children"
      machine: "machine"
      name: "name"
      description: "description"
      online: true
      id: "id"
      childrenCount: 1
  MediumAttachment:
    type: "object"
    properties:
      machine:
        type: "string"
      medium:
        type: "string"
      controller:
        type: "string"
      port:
        type: "integer"
        format: "int32"
      device:
        type: "integer"
        format: "int32"
      type:
        $ref: "#/definitions/DeviceType"
      passthrough:
        type: "boolean"
      temporaryEject:
        type: "boolean"
      isEjected:
        type: "boolean"
      nonRotational:
        type: "boolean"
      discard:
        type: "boolean"
      hotPluggable:
        type: "boolean"
      bandwidthGroup:
        $ref: "#/definitions/BandwidthGroup"
    description: " The IMediumAttachment interface links storage media to virtual\
      \ machines. For each medium (IMedium) which has been attached to a storage controller\
      \ (IStorageController) of a machine (IMachine) via the IMachine::attachDevice\
      \ method, one instance of IMediumAttachment is added to the machine's IMachine::mediumAttachments\
      \ array attribute.\nEach medium attachment specifies the storage controller\
      \ as well as a port and device number and the IMedium instance representing\
      \ a virtual hard disk or floppy or DVD image.\nFor removable media (DVDs or\
      \ floppies), there are two additional options. For one, the IMedium instance\
      \ can be @c null to represent an empty drive with no media inserted (see IMachine::mountMedium);\
      \ secondly, the medium can be one of the pseudo-media for host drives listed\
      \ in IHost::DVDDrives or IHost::floppyDrives.\n<h3>Attaching Hard Disks </h3>\n\
      Hard disks are attached to virtual machines using the IMachine::attachDevice\
      \ method and detached using the IMachine::detachDevice method. Depending on\
      \ a medium's type (see IMedium::type), hard disks are attached either <i>directly\
      \ </i> or  <i>indirectly </i>.\nWhen a hard disk is being attached directly,\
      \ it is associated with the virtual machine and used for hard disk operations\
      \ when the machine is running. When a hard disk is being attached indirectly,\
      \ a new differencing hard disk linked to it is implicitly created and this differencing\
      \ hard disk is associated with the machine and used for hard disk operations.\
      \ This also means that if IMachine::attachDevice performs a direct attachment\
      \ then the same hard disk will be returned in response to the subsequent IMachine::getMedium\
      \ call; however if an indirect attachment is performed then IMachine::getMedium\
      \ will return the implicitly created differencing hard disk, not the original\
      \ one passed to IMachine::attachDevice. In detail:\n<ul> <li> <b>Normal base\
      \ </b> hard disks that do not have children (i.e. differencing hard disks linked\
      \ to them) and that are not already attached to virtual machines in snapshots\
      \ are attached  <b>directly </b>. Otherwise, they are attached  <b>indirectly\
      \ </b> because having dependent children or being part of the snapshot makes\
      \ it impossible to modify hard disk contents without breaking the integrity\
      \ of the dependent party. The IMedium::readOnly attribute allows to quickly\
      \ determine the kind of the attachment for the given hard disk. Note that if\
      \ a normal base hard disk is to be indirectly attached to a virtual machine\
      \ with snapshots then a special procedure called  <i>smart attachment </i> is\
      \ performed (see below). </li> <li> <b>Normal differencing </b> hard disks are\
      \ like normal base hard disks: they are attached  <b>directly </b> if they do\
      \ not have children and are not attached to virtual machines in snapshots, and\
      \  <b>indirectly </b> otherwise. Note that the smart attachment procedure is\
      \ never performed for differencing hard disks. </li> <li> <b>Immutable </b>\
      \ hard disks are always attached  <b>indirectly </b> because they are designed\
      \ to be non-writable. If an immutable hard disk is attached to a virtual machine\
      \ with snapshots then a special procedure called smart attachment is performed\
      \ (see below). </li> <li> <b>Writethrough </b> hard disks are always attached\
      \  <b>directly </b>, also as designed. This also means that writethrough hard\
      \ disks cannot have other hard disks linked to them at all. </li> <li> <b>Shareable\
      \ </b> hard disks are always attached  <b>directly </b>, also as designed. This\
      \ also means that shareable hard disks cannot have other hard disks linked to\
      \ them at all. They behave almost like writethrough hard disks, except that\
      \ shareable hard disks can be attached to several virtual machines which are\
      \ running, allowing concurrent accesses. You need special cluster software running\
      \ in the virtual machines to make use of such disks. </li> </ul>\n\nNote that\
      \ the same hard disk, regardless of its type, may be attached to more than one\
      \ virtual machine at a time. In this case, the machine that is started first\
      \ gains exclusive access to the hard disk and attempts to start other machines\
      \ having this hard disk attached will fail until the first machine is powered\
      \ down.\nDetaching hard disks is performed in a  <i>deferred </i> fashion. This\
      \ means that the given hard disk remains associated with the given machine after\
      \ a successful IMachine::detachDevice call until IMachine::saveSettings is called\
      \ to save all changes to machine settings to disk. This deferring is necessary\
      \ to guarantee that the hard disk configuration may be restored at any time\
      \ by a call to IMachine::discardSettings before the settings are saved (committed).\n\
      Note that if IMachine::discardSettings is called after indirectly attaching\
      \ some hard disks to the machine but before a call to IMachine::saveSettings\
      \ is made, it will implicitly delete all differencing hard disks implicitly\
      \ created by IMachine::attachDevice for these indirect attachments. Such implicitly\
      \ created hard disks will also be immediately deleted when detached explicitly\
      \ using the IMachine::detachDevice call if it is made before IMachine::saveSettings.\
      \ This implicit deletion is safe because newly created differencing hard disks\
      \ do not contain any user data.\nHowever, keep in mind that detaching differencing\
      \ hard disks that were implicitly created by IMachine::attachDevice before the\
      \ last IMachine::saveSettings call will <b>not </b> implicitly delete them as\
      \ they may already contain some data (for example, as a result of virtual machine\
      \ execution). If these hard disks are no more necessary, the caller can always\
      \ delete them explicitly using IMedium::deleteStorage after they are actually\
      \ de-associated from this machine by the IMachine::saveSettings call.\n<h3>Smart\
      \ Attachment </h3>\nWhen normal base or immutable hard disks are indirectly\
      \ attached to a virtual machine then some additional steps are performed to\
      \ make sure the virtual machine will have the most recent 'view' of the hard\
      \ disk being attached. These steps include walking through the machine's snapshots\
      \ starting from the current one and going through ancestors up to the first\
      \ snapshot. Hard disks attached to the virtual machine in all of the encountered\
      \ snapshots are checked whether they are descendants of the given normal base\
      \ or immutable hard disk. The first found child (which is the differencing hard\
      \ disk) will be used instead of the normal base or immutable hard disk as a\
      \ parent for creating a new differencing hard disk that will be actually attached\
      \ to the machine. And only if no descendants are found or if the virtual machine\
      \ does not have any snapshots then the normal base or immutable hard disk will\
      \ be used itself as a parent for this differencing hard disk.\nIt is easier\
      \ to explain what smart attachment does using the following example:\nBEFORE\
      \ attaching B.vdi:       AFTER attaching B.vdi:\nSnapshot 1 (B.vdi)        \
      \    Snapshot 1 (B.vdi) Snapshot 2 (D1->B.vdi)        Snapshot 2 (D1->B.vdi)\
      \ Snapshot 3 (D2->D1.vdi)       Snapshot 3 (D2->D1.vdi) Snapshot 4 (none)  \
      \           Snapshot 4 (none) CurState   (none)             CurState   (D3->D2.vdi)\n\
      NOT ... CurState   (D3->B.vdi)\nThe first column is the virtual machine configuration\
      \ before the base hard disk B.vdi is attached, the second column shows the machine\
      \ after this hard disk is attached. Constructs like D1->B.vdi and similar mean\
      \ that the hard disk that is actually attached to the machine is a differencing\
      \ hard disk, D1.vdi, which is linked to (based on) another hard disk, B.vdi.\n\
      As we can see from the example, the hard disk B.vdi was detached from the machine\
      \ before taking Snapshot 4. Later, after Snapshot 4 was taken, the user decides\
      \ to attach B.vdi again. B.vdi has dependent child hard disks (D1.vdi, D2.vdi),\
      \ therefore it cannot be attached directly and needs an indirect attachment\
      \ (i.e. implicit creation of a new differencing hard disk). Due to the smart\
      \ attachment procedure, the new differencing hard disk (D3.vdi) will be based\
      \ on D2.vdi, not on B.vdi itself, since D2.vdi is the most recent view of B.vdi\
      \ existing for this snapshot branch of the given virtual machine.\nNote that\
      \ if there is more than one descendant hard disk of the given base hard disk\
      \ found in a snapshot, and there is an exact device, channel and bus match,\
      \ then this exact match will be used. Otherwise, the youngest descendant will\
      \ be picked up.\nThere is one more important aspect of the smart attachment\
      \ procedure which is not related to snapshots at all. Before walking through\
      \ the snapshots as described above, the backup copy of the current list of hard\
      \ disk attachment is searched for descendants. This backup copy is created when\
      \ the hard disk configuration is changed for the first time after the last IMachine::saveSettings\
      \ call and used by IMachine::discardSettings to undo the recent hard disk changes.\
      \ When such a descendant is found in this backup copy, it will be simply re-attached\
      \ back, without creating a new differencing hard disk for it. This optimization\
      \ is necessary to make it possible to re-attach the base or immutable hard disk\
      \ to a different bus, channel or device slot without losing the contents of\
      \ the differencing hard disk actually attached to the machine in place of it.\n"
    example:
      isEjected: true
      discard: true
      controller: "controller"
      temporaryEject: true
      bandwidthGroup:
        reference: 0
        name: "name"
        type: {}
        maxBytesPerSec: 9
      medium: "medium"
      nonRotational: true
      type: {}
      hotPluggable: true
      port: 7
      machine: "machine"
      passthrough: true
      device: 9
  Medium:
    type: "object"
    properties:
      id:
        type: "string"
      description:
        type: "string"
      state:
        $ref: "#/definitions/MediumState"
      variant:
        type: "array"
        items:
          $ref: "#/definitions/MediumVariant"
      location:
        type: "string"
      name:
        type: "string"
      deviceType:
        $ref: "#/definitions/DeviceType"
      hostDrive:
        type: "boolean"
      size:
        type: "integer"
        format: "int64"
      format:
        type: "string"
      mediumFormat:
        $ref: "#/definitions/MediumFormat"
      type:
        $ref: "#/definitions/MediumType"
      allowedTypes:
        type: "array"
        items:
          $ref: "#/definitions/MediumType"
      parent:
        type: "string"
      children:
        type: "array"
        items:
          type: "string"
      base:
        type: "string"
      readOnly:
        type: "boolean"
      logicalSize:
        type: "integer"
        format: "int64"
      autoReset:
        type: "boolean"
      lastAccessError:
        type: "string"
      machineIds:
        type: "array"
        items:
          type: "string"
    description: " The IMedium interface represents virtual storage for a machine's\
      \ hard disks, CD/DVD or floppy drives. It will typically represent a disk image\
      \ on the host, for example a VDI or VMDK file representing a virtual hard disk,\
      \ or an ISO or RAW file representing virtual removable media, but can also point\
      \ to a network location (e.g. for iSCSI targets).\nInstances of IMedium are\
      \ connected to virtual machines by way of medium attachments, which link the\
      \ storage medium to a particular device slot of a storage controller of the\
      \ virtual machine. In the VirtualBox API, virtual storage is therefore always\
      \ represented by the following chain of object links:\n<ul> <li>IMachine::storageControllers\
      \ contains an array of storage controllers (IDE, SATA, SCSI, SAS or a floppy\
      \ controller; these are instances of IStorageController). </li> <li>IMachine::mediumAttachments\
      \ contains an array of medium attachments (instances of IMediumAttachment created\
      \ by IMachine::attachDevice), each containing a storage controller from the\
      \ above array, a port/device specification, and an instance of IMedium representing\
      \ the medium storage (image file).\nFor removable media, the storage medium\
      \ is optional; a medium attachment with no medium represents a CD/DVD or floppy\
      \ drive with no medium inserted. By contrast, hard disk attachments will always\
      \ have an IMedium object attached. </li> <li>Each IMedium in turn points to\
      \ a storage unit (such as a file on the host computer or a network resource)\
      \ that holds actual data. This location is represented by the #location attribute.\
      \ </li> </ul>\n\nExisting media are opened using IVirtualBox::openMedium; new\
      \ hard disk media can be created with the VirtualBox API using the IVirtualBox::createMedium\
      \ method. Differencing hard disks (see below) are usually implicitly created\
      \ by VirtualBox as needed, but may also be created explicitly using #createDiffStorage.\
      \ VirtualBox cannot create CD/DVD or floppy images (ISO and RAW files); these\
      \ should be created with external tools and then opened from within VirtualBox.\n\
      Only for CD/DVDs and floppies, an IMedium instance can also represent a host\
      \ drive. In that case the #id attribute contains the UUID of one of the drives\
      \ in IHost::DVDDrives or IHost::floppyDrives.\n<h3>Media registries </h3>\n\
      When a medium has been opened or created using one of the aforementioned APIs,\
      \ it becomes 'known' to VirtualBox. Known media can be attached to virtual machines\
      \ and re-found through IVirtualBox::openMedium. They also appear in the global\
      \ IVirtualBox::hardDisks, IVirtualBox::DVDImages and IVirtualBox::floppyImages\
      \ arrays.\nPrior to VirtualBox 4.0, opening a medium added it to a global media\
      \ registry in the VirtualBox.xml file, which was shared between all machines\
      \ and made transporting machines and their media from one host to another difficult.\n\
      Starting with VirtualBox 4.0, media are only added to a registry when they are\
      \ <i>attached </i> to a machine using IMachine::attachDevice. For backwards\
      \ compatibility, which registry a medium is added to depends on which VirtualBox\
      \ version created a machine:\n<ul> <li>If the medium has first been attached\
      \ to a machine which was created by VirtualBox 4.0 or later, it is added to\
      \ that machine's media registry in the machine XML settings file. This way all\
      \ information about a machine's media attachments is contained in a single file\
      \ and can be transported easily. </li> <li>For older media attachments (i.e.\
      \ if the medium was first attached to a machine which was created with a VirtualBox\
      \ version before 4.0), media continue to be registered in the global VirtualBox\
      \ settings file, for backwards compatibility. </li> </ul>\n\nSee IVirtualBox::openMedium\
      \ for more information.\nMedia are removed from media registries by the IMedium::close,\
      \ #deleteStorage and #mergeTo methods.\n<h3>Accessibility checks </h3>\nVirtualBox\
      \ defers media accessibility checks until the #refreshState method is called\
      \ explicitly on a medium. This is done to make the VirtualBox object ready for\
      \ serving requests as fast as possible and let the end-user application decide\
      \ if it needs to check media accessibility right away or not.\nAs a result,\
      \ when VirtualBox starts up (e.g. the VirtualBox object gets created for the\
      \ first time), all known media are in the 'Inaccessible' state, but the value\
      \ of the #lastAccessError attribute is an empty string because no actual accessibility\
      \ check has been made yet.\nAfter calling #refreshState, a medium is considered\
      \ <i>accessible </i> if its storage unit can be read. In that case, the #state\
      \ attribute has a value of 'Created'. If the storage unit cannot be read (for\
      \ example, because it is located on a disconnected network resource, or was\
      \ accidentally deleted outside VirtualBox), the medium is considered  <i>inaccessible\
      \ </i>, which is indicated by the 'Inaccessible' state. The exact reason why\
      \ the medium is inaccessible can be obtained by reading the #lastAccessError\
      \ attribute.\n<h3>Medium types </h3>\nThere are five types of medium behavior\
      \ which are stored in the #type attribute (see MediumType) and which define\
      \ the medium's behavior with attachments and snapshots.\nAll media can be also\
      \ divided in two groups:  <i>base </i> media and <i>differencing </i> media.\
      \ A base medium contains all sectors of the medium data in its own storage and\
      \ therefore can be used independently. In contrast, a differencing medium is\
      \ a 'delta' to some other medium and contains only those sectors which differ\
      \ from that other medium, which is then called a  <i>parent </i>. The differencing\
      \ medium is said to be <i>linked to </i> that parent. The parent may be itself\
      \ a differencing medium, thus forming a chain of linked media. The last element\
      \ in that chain must always be a base medium. Note that several differencing\
      \ media may be linked to the same parent medium.\nDifferencing media can be\
      \ distinguished from base media by querying the #parent attribute: base media\
      \ do not have parents they would depend on, so the value of this attribute is\
      \ always @c null for them. Using this attribute, it is possible to walk up the\
      \ medium tree (from the child medium to its parent). It is also possible to\
      \ walk down the tree using the #children attribute.\nNote that the type of all\
      \ differencing media is 'normal'; all other values are meaningless for them.\
      \ Base media may be of any type.\n<h3>Automatic composition of the file name\
      \ part </h3>\nAnother extension to the IMedium::location attribute is that there\
      \ is a possibility to cause VirtualBox to compose a unique value for the file\
      \ name part of the location using the UUID of the hard disk. This applies only\
      \ to hard disks in MediumState_NotCreated state, e.g. before the storage unit\
      \ is created, and works as follows. You set the value of the IMedium::location\
      \ attribute to a location specification which only contains the path specification\
      \ but not the file name part and ends with either a forward slash or a backslash\
      \ character. In response, VirtualBox will generate a new UUID for the hard disk\
      \ and compose the file name using the following pattern:\n<path>/{<uuid>}.<ext>\n\
      where <path> is the supplied path specification, <uuid> is the newly generated\
      \ UUID and <ext> is the default extension for the storage format of this hard\
      \ disk. After that, you may call any of the methods that create a new hard disk\
      \ storage unit and they will use the generated UUID and file name. "
    example:
      deviceType: {}
      allowedTypes:
      - null
      - null
      parent: "parent"
      hostDrive: true
      autoReset: true
      format: "format"
      lastAccessError: "lastAccessError"
      machineIds:
      - "machineIds"
      - "machineIds"
      description: "description"
      readOnly: true
      type: {}
      size: 0
      children:
      - "children"
      - "children"
      logicalSize: 6
      variant:
      - {}
      - {}
      name: "name"
      mediumFormat:
        capabilities:
        - {}
        - {}
        name: "name"
        id: "id"
      location: "location"
      id: "id"
      state: {}
      base: "base"

    description: " Represents a storage controller that is attached to a virtual machine\
      \ (IMachine). Just as drives (hard disks, DVDs, FDs) are attached to storage\
      \ controllers in a real computer, virtual drives (represented by IMediumAttachment)\
      \ are attached to virtual storage controllers, represented by this interface.\n\
      As opposed to physical hardware, VirtualBox has a very generic concept of a\
      \ storage controller, and for purposes of the Main API, all virtual storage\

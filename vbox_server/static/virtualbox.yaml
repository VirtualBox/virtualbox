  /vms/{vmid}/console/actions/powerup:
    post:
      tags:
      - "vm"
      summary: "Call interface method IConsole::powerUp"
      description: " Starts the virtual machine execution using the current machine\
        \ state (that is, its current execution state, current settings and current\
        \ storage devices).\nNote! This method is only useful for front-ends that\
        \ want to actually execute virtual machines in their own process (like the\
        \ VirtualBox or VBoxSDL front-ends). Unless you are intending to write such\
        \ a front-end, do not call this method. If you simply want to start virtual\
        \ machine execution using one of the existing front-ends (for example the\
        \ VirtualBox GUI or headless server), use IMachine::launchVMProcess instead;\
        \ these front-ends will power up the machine automatically for you.\n\nIf\
        \ the machine is powered off or aborted, the execution will start from the\
        \ beginning (as if the real hardware were just powered on).\nIf the machine\
        \ is in the MachineState_Saved state or the MachineState_AbortedSaved state\
        \ it will continue its execution from the point where the state was saved.\n\
        If the machine IMachine::teleporterEnabled property is enabled on the machine\
        \ being powered up, the machine will wait for an incoming teleportation in\
        \ the MachineState_TeleportingIn state. The returned progress object will\
        \ have at least three operations where the last three are defined as: (1)\
        \ powering up and starting TCP server, (2) waiting for incoming teleportations,\
        \ and (3) perform teleportation. These operations will be reflected as the\
        \ last three operations of the progress objected returned by IMachine::launchVMProcess\
        \ as well.\n\n<h3>Possible results</h3> VBOX_E_INVALID_VM_STATE: Virtual machine\
        \ already running.\nVBOX_E_HOST_ERROR: Host interface does not exist or name\
        \ not set.\nVBOX_E_FILE_ERROR: Invalid saved state file. "
      operationId: "console_powerup"
      produces:
      - "application/json"
      parameters:
      - name: "vmid"
        in: "path"
        description: "The Id of vm"

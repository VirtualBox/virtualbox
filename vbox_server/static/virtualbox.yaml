  SharedFolder:
    type: "object"
    properties:
      name:
        type: "string"
      hostPath:
        type: "string"
      accessible:
        type: "boolean"
      writable:
        type: "boolean"
      autoMount:
        type: "boolean"
      autoMountPoint:
        type: "string"
      lastAccessError:
        type: "string"
    description: " The ISharedFolder interface represents a folder in the host computer's\
      \ file system accessible from the guest OS running inside a virtual machine\
      \ using an associated logical name.\nThere are three types of shared folders:\
      \ <ul> <li> <i>Global </i> (IVirtualBox::sharedFolders), shared folders available\
      \ to all virtual machines. </li> <li> <i>Permanent </i> (IMachine::sharedFolders),\
      \ VM-specific shared folders available to the given virtual machine at startup.\
      \ </li> <li> <i>Transient </i> (IConsole::sharedFolders), VM-specific shared\
      \ folders created in the session context (for example, when the virtual machine\
      \ is running) and automatically discarded when the session is closed (the VM\
      \ is powered off). </li> </ul>\n\nLogical names of shared folders must be unique\
      \ within the given scope (global, permanent or transient). However, they do\
      \ not need to be unique across scopes. In this case, the definition of the shared\
      \ folder in a more specific scope takes precedence over definitions in all other\
      \ scopes. The order of precedence is (more specific to more general): <ol> <li>Transient\
      \ definitions </li> <li>Permanent definitions </li> <li>Global definitions </li>\
      \ </ol>\n\nFor example, if MyMachine has a shared folder named C_DRIVE (that\
      \ points to C:\\), then creating a transient shared folder named C_DRIVE (that\
      \ points to C:\\\\WINDOWS) will change the definition of C_DRIVE in the guest\
      \ OS so that \\\\VBOXSVR\\C_DRIVE will give access to C:\\WINDOWS instead of\
      \ C:\\ on the host PC. Removing the transient shared folder C_DRIVE will restore\
      \ the previous (permanent) definition of C_DRIVE that points to C:\\ if it still\
      \ exists.\nNote that permanent and transient shared folders of different machines\
      \ are in different name spaces, so they don't overlap and don't need to have\
      \ unique logical names.\nNote! Global shared folders are not implemented in\
      \ the current version of the product. "
    example:
      accessible: true
      name: "name"
      lastAccessError: "lastAccessError"
      autoMountPoint: "autoMountPoint"
      hostPath: "hostPath"
      writable: true
      autoMount: true
  Session:
    type: "object"
    properties:
      state:
        $ref: "#/definitions/SessionState"
      type:
        $ref: "#/definitions/SessionType"
      name:
        type: "string"
      machine:
        type: "string"
      console:
        $ref: "#/definitions/Console"
    description: " The ISession interface represents a client process and allows for\
      \ locking virtual machines (represented by IMachine objects) to prevent conflicting\
      \ changes to the machine.\nAny caller wishing to manipulate a virtual machine\
      \ needs to create a session object first, which lives in its own process space.\
      \ Such session objects are then associated with IMachine objects living in the\
      \ VirtualBox server process to coordinate such changes.\nThere are two typical\
      \ scenarios in which sessions are used:\n<ul> <li>To alter machine settings\
      \ or control a running virtual machine, one needs to lock a machine for a given\
      \ session (client process) by calling IMachine::lockMachine.\nWhereas multiple\
      \ sessions may control a running virtual machine, only one process can obtain\
      \ a write lock on the machine to prevent conflicting changes. A write lock is\
      \ also needed if a process wants to actually run a virtual machine in its own\
      \ context, such as the VirtualBox GUI or VBoxHeadless front-ends. They must\
      \ also lock a machine for their own sessions before they are allowed to power\
      \ up the virtual machine.\nAs a result, no machine settings can be altered while\
      \ another process is already using it, either because that process is modifying\
      \ machine settings or because the machine is running. </li> <li>To start a VM\
      \ using one of the existing VirtualBox front-ends (e.g. the VirtualBox GUI or\
      \ VBoxHeadless), one would use IMachine::launchVMProcess, which also takes a\
      \ session object as its first parameter. This session then identifies the caller\
      \ and lets the caller control the started machine (for example, pause machine\
      \ execution or power it down) as well as be notified about machine execution\
      \ state changes. </li> </ul>\n\nHow sessions objects are created in a client\
      \ process depends on whether you use the Main API via COM or via the webservice:\n\
      <ul> <li>When using the COM API directly, an object of the Session class from\
      \ the VirtualBox type library needs to be created. In regular COM C++ client\
      \ code, this can be done by calling createLocalObject(), a standard COM API.\
      \ This object will then act as a local session object in further calls to open\
      \ a session. </li> <li>In the webservice, the session manager (IWebsessionManager)\
      \ instead creates a session object automatically whenever IWebsessionManager::logon\
      \ is called. A managed object reference to that session object can be retrieved\
      \ by calling IWebsessionManager::getSessionObject. </li> </ul> "
  StorageController:
    type: "object"
    properties:

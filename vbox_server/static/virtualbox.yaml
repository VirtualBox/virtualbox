    description: " The ISerialPort interface represents the virtual serial port device.\n\
      The virtual serial port device acts like an ordinary serial port inside the\
      \ virtual machine. This device communicates to the real serial port hardware\
      \ in one of two modes: host pipe or host device.\nIn host pipe mode, the #path\
      \ attribute specifies the path to the pipe on the host computer that represents\
      \ a serial port. The #server attribute determines if this pipe is created by\
      \ the virtual machine process at machine startup or it must already exist before\
      \ starting machine execution.\nIn host device mode, the #path attribute specifies\
      \ the name of the serial port device on the host computer.\nThere is also a\
      \ third communication mode: the disconnected mode. In this mode, the guest OS\
      \ running inside the virtual machine will be able to detect the serial port,\
      \ but all port write operations will be discarded and all port read operations\
      \ will return no data.\n"
    example:
      server: true
      path: "path"
      uartType: {}
      IRQ: 1
      hostMode: {}
      slot: 0
      enabled: true
      IOAddress: 6

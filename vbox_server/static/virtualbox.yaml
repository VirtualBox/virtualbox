  USBDeviceFilter:
    type: "object"
    properties:
      name:
        type: "string"
      active:
        type: "boolean"
      vendorId:
        type: "string"
      productId:
        type: "string"
      revision:
        type: "string"
      manufacturer:
        type: "string"
      product:
        type: "string"
      serialNumber:
        type: "string"
      port:
        type: "string"
      remote:
        type: "string"
      maskedInterfaces:
        type: "integer"
        format: "int32"
    description: " The IUSBDeviceFilter interface represents a USB device filter used\
      \ to perform actions on one or more USB devices.\nUSB device filters are used\
      \ by running virtual machines to automatically capture selected USB devices\
      \ once they are physically attached to the host computer.\nA USB device is matched\
      \ to a specific device filter if and only if all attributes of the device filter\
      \ match the corresponding attributes of the device (that is, attributes are\
      \ joined together using a logical AND operation). On the other hand filter attributes\
      \ in separate USB device filters are applied as a logical OR operation. So if\
      \ one would like to create a match such as 'this vendor id OR this product id',\
      \ then one would need to create two filters and specify 'any match' (see below)\
      \ for the other unused attributes.\nAll filter attributes used for matching\
      \ are strings.  The following filtering expressions are currently supported:\n\
      <ul> <li> <i>Interval filters </i>. Used to specify valid intervals for integer\
      \ device attributes (Vendor ID, Product ID, Revision and Port). The format of\
      \ the string is:\nint:((m)|([m]-[n]))(,(m)|([m]-[n]))*\nwhere m and n are integer\
      \ numbers, either in octal (starting with 0), hexadecimal (starting with 0x)\
      \ or decimal (otherwise), so that m < n. If m is omitted before a dash (-),\
      \ the minimum possible integer is assumed; if n is omitted after a dash, the\
      \ maximum possible integer is assumed. </li> <li> <i>Boolean filters </i>. Used\
      \ to specify acceptable values for boolean device attributes. The format of\
      \ the string is:\ntrue|false|yes|no|0|1 </li> <li> <i>Exact match </i>. Used\
      \ to specify a single value for the given device attribute. Any string that\
      \ doesn't start with int: represents an exact match. String device attributes\
      \ are compared to this string in a case-sensitive manner. Integer attributes\
      \ are first converted to a string (see individual filter attributes) and then\
      \ compared in a case-insensitive manner.\n</li> <li> <i>Any match </i>. Any\
      \ value of the corresponding device attribute will match the given filter. An\
      \ empty or @c null string is used to construct this type of filtering expressions.\n\
      </li> </ul> Note! On Windows hosts, interval filters are not currently available.\
      \ Also all string filter attributes (#manufacturer, #product, #serialNumber)\
      \ are ignored, so they behave as <i>any match </i> no matter what string expression\
      \ is specified. "
    example:
      product: "product"
      serialNumber: "serialNumber"
      productId: "productId"
      port: "port"
      name: "name"
      active: true
      vendorId: "vendorId"
      remote: "remote"
      revision: "revision"
      manufacturer: "manufacturer"
      maskedInterfaces: 7
  HostUSBDevice:
    type: "object"
    properties:
      state:
        $ref: "#/definitions/USBDeviceState"
    description: " The IHostUSBDevice interface represents a physical USB device attached\
      \ to the host computer.\nBesides properties inherited from IUSBDevice, this\
      \ interface adds the #state property that holds the current state of the USB\
      \ device.\n"
    example:
      state: {}
  HostUSBDeviceFilter:
    type: "object"
    properties:
      action:
        $ref: "#/definitions/USBDeviceFilterAction"
    description: " The IHostUSBDeviceFilter interface represents a global filter for\
      \ a physical USB device used by the host computer. Used indirectly in IHost::USBDeviceFilters.\n\
      Using filters of this type, the host computer determines the initial state of\
      \ the USB device after it is physically attached to the host's USB controller.\n\
      Note! The IUSBDeviceFilter::remote attribute is ignored by this type of filters,\
      \ because it makes sense only for IUSBDeviceFilters::deviceFilters. "
    example:
      action: {}
  USBProxyBackend:

  EventSource:
    type: "object"
    description: " Event source. Generally, any object which could generate events\
      \ can be an event source, or aggregate one. To simplify using one-way protocols\
      \ such as webservices running on top of HTTP(S), an event source can work with\
      \ listeners in either active or passive mode. In active mode it is up to the\
      \ IEventSource implementation to call IEventListener::handleEvent, in passive\
      \ mode the event source keeps track of pending events for each listener and\
      \ returns available events on demand.\nSee IEvent for an introduction to VirtualBox\
      \ event handling. "
  EventListener:
    type: "object"
    description: " Event listener. An event listener can work in either active or\
      \ passive mode, depending on the way it was registered. See IEvent for an introduction\
      \ to VirtualBox event handling. "
  Event:
    type: "object"
    properties:
      type:
        $ref: "#/definitions/VBoxEventType"
      source:
        $ref: "#/definitions/EventSource"
      waitable:
        type: "boolean"
    description: " Abstract parent interface for VirtualBox events. Actual events\
      \ will typically implement a more specific interface which derives from this\
      \ (see below).\n<b>Introduction to VirtualBox events </b>\nGenerally speaking,\
      \ an event (represented by this interface) signals that something happened,\
      \ while an event listener (see IEventListener) represents an entity that is\
      \ interested in certain events. In order for this to work with unidirectional\
      \ protocols (i.e. web services), the concepts of passive and active listener\
      \ are used.\nEvent consumers can register themselves as listeners, providing\
      \ an array of events they are interested in (see IEventSource::registerListener).\
      \ When an event triggers, the listener is notified about the event. The exact\
      \ mechanism of the notification depends on whether the listener was registered\
      \ as an active or passive listener:\n<ul> <li>An active listener is very similar\
      \ to a callback: it is a function invoked by the API. As opposed to the callbacks\
      \ that were used in the API before VirtualBox 4.0 however, events are now objects\
      \ with an interface hierarchy. </li> <li>Passive listeners are somewhat trickier\
      \ to implement, but do not require a client function to be callable, which is\
      \ not an option with scripting languages or web service clients. Internally\
      \ the IEventSource implementation maintains an event queue for each passive\
      \ listener, and newly arrived events are put in this queue. When the listener\
      \ calls IEventSource::getEvent, first element from its internal event queue\
      \ is returned. When the client completes processing of an event, the IEventSource::eventProcessed\
      \ function must be called, acknowledging that the event was processed. It supports\
      \ implementing waitable events. On passive listener unregistration, all events\
      \ from its queue are auto-acknowledged. </li> </ul>\n\nWaitable events are useful\
      \ in situations where the event generator wants to track delivery or a party\
      \ wants to wait until all listeners have completed the event. A typical example\
      \ would be a vetoable event (see IVetoEvent) where a listeners might veto a\
      \ certain action, and thus the event producer has to make sure that all listeners\
      \ have processed the event and not vetoed before taking the action.\nA given\
      \ event may have both passive and active listeners at the same time.\n<b>Using\
      \ events </b>\nAny VirtualBox object capable of producing externally visible\
      \ events provides an @c eventSource read-only attribute, which is of the type\
      \ IEventSource. This event source object is notified by VirtualBox once something\
      \ has happened, so consumers may register event listeners with this event source.\
      \ To register a listener, an object implementing the IEventListener interface\
      \ must be provided. For active listeners, such an object is typically created\
      \ by the consumer, while for passive listeners IEventSource::createListener\
      \ should be used. Please note that a listener created with IEventSource::createListener\
      \ must not be used as an active listener.\nOnce created, the listener must be\
      \ registered to listen for the desired events (see IEventSource::registerListener),\
      \ providing an array of VBoxEventType enums. Those elements can either be the\
      \ individual event IDs or wildcards matching multiple event IDs.\nAfter registration,\
      \ the callback's IEventListener::handleEvent method is called automatically\
      \ when the event is triggered, while passive listeners have to call IEventSource::getEvent\
      \ and IEventSource::eventProcessed in an event processing loop.\nThe IEvent\
      \ interface is an abstract parent interface for all such VirtualBox events coming\
      \ in. As a result, the standard use pattern inside IEventListener::handleEvent\
      \ or the event processing loop is to check the #type attribute of the event\
      \ and then cast to the appropriate specific interface using @c QueryInterface(). "

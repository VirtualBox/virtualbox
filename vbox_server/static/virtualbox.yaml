  /vms/:
    post:
      tags:
      - "vm"
      summary: "Call interface method IVirtualBox::createMachine"
      description: " Creates a new virtual machine by creating a machine settings\
        \ file at the given location.\nVirtualBox machine settings files use a custom\
        \ XML dialect. Starting with VirtualBox 4.0, a '.vbox' extension is recommended,\
        \ but not enforced, and machine files can be created at arbitrary locations.\n\
        However, it is recommended that machines are created in the default machine\
        \ folder (e.g. '/home/user/VirtualBox VMs/name/name.vbox'; see ISystemProperties::defaultMachineFolder).\
        \ If you specify @c null or empty string (which is recommended) for the @a\
        \ settingsFile argument, #composeMachineFilename is called automatically to\
        \ have such a recommended name composed based on the machine name given in\
        \ the @a name argument and the primary group.\nIf the resulting settings file\
        \ already exists, this method will fail, unless the forceOverwrite flag is\
        \ set.\nThe new machine is created unregistered, with the initial configuration\
        \ set according to the specified guest OS type. A typical sequence of actions\
        \ to create a new virtual machine is as follows:\n<ol> <li> Call this method\
        \ to have a new machine created. The returned machine object will be 'mutable'\
        \ allowing to change any machine property. </li> <li> Configure the machine\
        \ using the appropriate attributes and methods. </li> <li> Call IMachine::saveSettings\
        \ to write the settings to the machine's XML settings file. The configuration\
        \ of the newly created machine will not be saved to disk until this method\
        \ is called. </li> <li> Call #registerMachine to add the machine to the list\
        \ of machines known to VirtualBox. </li> </ol>\n\nThe specified guest OS type\
        \ identifier must match an ID of one of known guest OS types listed in the\
        \ IVirtualBox::guestOSTypes array.\nNote! IMachine::settingsModified will\
        \ return @c false for the created machine, until any of machine settings are\
        \ changed. Note! There is no way to change the name of the settings file or\
        \ subfolder of the created machine directly.\n<h3>Possible results</h3> VBOX_E_OBJECT_NOT_FOUND:\
        \ @a osTypeId is invalid.\nVBOX_E_FILE_ERROR: Resulting settings file name\
        \ is invalid or the settings file already exists or could not be created due\
        \ to an I/O error.\nE_INVALIDARG: @a name is empty or @c null. "

      \ format. This interface provides information about the properties of the associated\
      \ backend.\nEach medium format is identified by a string represented by the\
      \ #id attribute. This string is used in calls like IVirtualBox::createMedium\
      \ to specify the desired format.\nThe list of all supported medium formats can\
      \ be obtained using ISystemProperties::mediumFormats.\n"

definitions:
  Error:
    type: "object"
    required:
    - "code"
    - "message"
    properties:
      code:
        type: "integer"
        description: "API specific error code"
      message:
        type: "string"
        example: "Something is broken"
        description: "User-friendly description of error"
  SettingsVersion:
    type: "string"
    description: " Settings version of VirtualBox settings files. This is written\
      \ to the 'version' attribute of the root 'VirtualBox' element in the settings\
      \ file XML and indicates which VirtualBox version wrote the file. "
    enum:
    - "null"
    - "V1_0"
    - "V1_1"
    - "V1_2"
    - "V1_3PRE"
    - "V1_3"
    - "V1_4"
    - "V1_5"
    - "V1_6"
    - "V1_7"
    - "V1_8"
    - "V1_9"
    - "V1_10"
    - "V1_11"
    - "V1_12"
    - "V1_13"
    - "V1_14"
    - "V1_15"
    - "V1_16"
    - "V1_17"
    - "V1_18"
    - "V1_19"
    - "V1_20"
    - "FUTURE"
  AccessMode:
    type: "string"
    description: " Access mode for opening files. "
    enum:
    - "READONLY"
    - "READWRITE"
  MachineState:
    type: "string"
    description: " Virtual machine execution state.\nThis enumeration represents possible\
      \ values of the IMachine::state attribute.\nBelow is the basic virtual machine\
      \ state diagram. It shows how the state changes during virtual machine execution.\
      \ The text in square braces shows a method of the IConsole or IMachine interface\
      \ that performs the given state transition.\n\n+---------[powerDown()] <- Stuck\
      \ <--[failure]-+ V                                             | +-> PoweredOff\
      \ --+-->[powerUp()]--> Starting --+      | +-----[resume()]-----+ |        \
      \        |                             |      | V                    | |   Aborted\
      \ <----+                             +--> Running --[pause()]--> Paused |  \
      \                                            |      ^ |                   ^\
      \ | |  AbortedSaved <-----------[failure]-----<----+      | |              \
      \     | | |       |                                      |      | |        \
      \           | | |       +-------------+                        |      | |  \
      \                 | | |                     V                        |     \
      \ | |                   | | |   Saved --------[powerUp()]-----> Restoring -+\
      \      | |                   | | |     ^                                   \
      \            | |                   | | |     |     +-----------------------------------------+-|-------------------+\
      \ + |     |     |                                           |              \
      \       | |     |     +- OnlineSnapshotting <--[takeSnapshot()]<--+---------------------+\
      \ |     |                                                 |                \
      \     | |     +-------- Saving <--------[saveState()]<----------+---------------------+\
      \ |                                                       |                \
      \     | +-------------- Stopping -------[powerDown()]<----------+---------------------+\n\
      \nNote that states to the right of PoweredOff, Aborted, AbortedSaved, and Saved\
      \ in the above diagram are called  <i>online VM states </i>. These states represent\
      \ the virtual machine which is being executed in a dedicated process (usually\
      \ with a GUI window attached to it where you can see the activity of the virtual\
      \ machine and interact with it). There are two special pseudo-states, FirstOnline\
      \ and LastOnline, that can be used in relational expressions to detect if the\
      \ given machine state is online or not:\n\nif (machine.GetState() >= MachineState_FirstOnline\
      \ && machine.GetState() <= MachineState_LastOnline) { ...the machine is being\
      \ executed... }\n\nWhen the virtual machine is in one of the online VM states\
      \ (that is, being executed), only a few machine settings can be modified. Methods\
      \ working with such settings contain an explicit note about that. An attempt\
      \ to change any other setting or perform a modifying operation during this time\
      \ will result in the @c VBOX_E_INVALID_VM_STATE error.\nAll online states except\
      \ Running, Paused and Stuck are transitional: they represent temporary conditions\
      \ of the virtual machine that will last as long as the operation that initiated\
      \ such a condition.\nThe Stuck state is a special case. It means that execution\
      \ of the machine has reached the 'Guru Meditation' condition. This condition\
      \ indicates an internal VMM (virtual machine manager) failure which may happen\
      \ as a result of either an unhandled low-level virtual hardware exception or\
      \ one of the recompiler exceptions (such as the  <i>too-many-traps </i> condition).\n\
      Note also that any online VM state may transit to the Aborted state. This happens\
      \ if the process that is executing the virtual machine terminates unexpectedly\
      \ (for example, crashes). Other than that, the Aborted state is equivalent to\
      \ PoweredOff.\nThere are also a few additional state diagrams that do not deal\
      \ with virtual machine execution and therefore are shown separately. The states\
      \ shown on these diagrams are called  <i>offline VM states </i> (this includes\
      \ PoweredOff, Aborted, AbortedSaved and Saved too).\nThe first diagram shows\
      \ what happens when a lengthy setup operation is being executed (such as IMachine::attachDevice).\n\
      \n+----------------------------------(same state as before the call)------+\
      \ |                                                                       |\
      \ +-> PoweredOff --+                                                      |\
      \ |                |                                                      |\
      \ |-> Aborted -----+-->[lengthy VM configuration call] --> SettingUp -----+\
      \ |                | +-> Saved -------+\n\nThe next two diagrams demonstrate\
      \ the process of taking a snapshot of a powered off virtual machine, restoring\
      \ the state to that as of a snapshot or deleting a snapshot, respectively.\n\
      \n+----------------------------------(same state as before the call)------+\
      \ |                                                                       |\
      \ +-> PoweredOff --+                                                      |\
      \ |                +-->[takeSnapshot()] ------------------> Snapshotting -+\
      \ +-> Aborted -----+\n+-> PoweredOff --+ |                | |   Aborted -----+-->[restoreSnapshot()\
      \    ]-------> RestoringSnapshot -+ |                |   [deleteSnapshot() \
      \    ]-------> DeletingSnapshot --+ +-> Saved -------+                     \
      \                                 | |                                      \
      \                                 | +---(Saved if restored from an online snapshot,\
      \ PoweredOff otherwise)---+ Note! For whoever decides to touch this enum: In\
      \ order to keep the comparisons involving FirstOnline and LastOnline pseudo-states\
      \ valid, the numeric values of these states must be correspondingly updated\
      \ if needed: for any online VM state, the condition FirstOnline <= state <=\
      \ LastOnline must be @c true. The same relates to transient states for which\
      \ the condition FirstOnline <= state <= LastOnline must be @c true. "
    enum:
    - "null"
    - "POWEREDOFF"
    - "SAVED"
    - "TELEPORTED"
    - "ABORTED"
    - "ABORTEDSAVED"
    - "RUNNING"
    - "PAUSED"
    - "STUCK"
    - "TELEPORTING"
    - "LIVESNAPSHOTTING"
    - "STARTING"
    - "STOPPING"
    - "SAVING"
    - "RESTORING"
    - "TELEPORTINGPAUSEDVM"
    - "TELEPORTINGIN"
    - "DELETINGSNAPSHOTONLINE"
